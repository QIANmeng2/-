# ============================================
# neondream.cn - 生产级 Nginx 完整配置
# 适用：Tencent Cloud 香港 CVM + Nginx
# 架构：Cloudflare CDN → Nginx → Node.js :8080
# ============================================

# -------- 主配置 /etc/nginx/nginx.conf http 块内插入 -------

# ------- 核心性能参数 -------
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    # ------- 基础优化 -------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    # ------- 连接复用 -------
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # ------- Gzip 压缩 -------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/font-woff;

    # ------- Brotli 压缩（需 nginx 支持，可选）-------
    # 如果编译了 ngx_brotli 模块，取消注释：
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------- 浏览器缓存（静态资源）-------
    map $sent_http_content_type $cache_control {
        default                                         "";
        "~text/css"                                     "max-age=31536000, immutable";
        "~application/javascript"                         "max-age=31536000, immutable";
        "~image/"                                        "max-age=31536000, immutable";
        "~font/"                                         "max-age=31536000, immutable";
        "~application/font"                              "max-age=31536000, immutable";
    }

    # ------- 上游超时控制 -------
    proxy_connect_timeout 10s;
    proxy_send_timeout   60s;
    proxy_read_timeout   60s;
    proxy_buffering      on;
    proxy_buffer_size    16k;
    proxy_buffers        32 16k;

    # ------- 客户端上传限制 -------
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # ------- MIME 类型 -------
    include mime.types;
    default_type application/octet-stream;

    # ======= 站点：neondream.cn =======
    # Cloudflare 连接方式：
    #   Cloudflare → (HTTP 80/443) → Nginx
    #   SSL 可由 Cloudflare 终端处理（推荐），Nginx 只需监听 80
    #   或由 Nginx 终止 SSL（需有证书），Cloudflare 用 Full SSL
    #
    # 以下配置同时支持：
    #   A) Cloudflare Flexible/Full（Nginx 只开 80）
    #   B) Cloudflare Full (Strict)（Nginx 开 443 + 有效证书）

    # --- HTTP 80（Cloudflare 或直连）---
    server {
        listen 80;
        listen [::]:80;
        server_name neondream.cn www.neondream.cn;

        # --- 强制 HTTPS（如果 Nginx 有证书）---
        # return 301 https://$host$request_uri;

        root /var/www/html;
        index index.html;

        # --- 静态资源：长缓存 ---
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|avif)$ {
            expires 1y;
            add_header Cache-Control $cache_control always;
            add_header Access-Control-Allow-Origin *;
            access_log off;
        }

        # --- favicon.ico ---
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # --- HTML：不缓存（SPA 必须）---
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        # --- Socket.IO / WebSocket 代理 ---
        include /etc/nginx/conf.d/websocket-upstream.conf;

        # --- Node.js 后端 API 代理 ---
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # API 不缓存
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # --- 健康检查（Railway/GitHub Actions 用）---
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type "text/plain";
        }

        # --- SPA fallback ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # --- HTTPS 443（如有证书，取消注释）---
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name neondream.cn www.neondream.cn;
    #
    #     ssl_certificate     /etc/nginx/ssl/neondream.cn.pem;
    #     ssl_certificate_key /etc/nginx/ssl/neondream.cn.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     root /var/www/html;
    #     index index.html;
    #
    #     # （静态 / API / SPA 配置同 80 server 块）
    # }
}
