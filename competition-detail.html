<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛事详情 · 梦工厂</title>
  <link rel="stylesheet" href="styles.css?v=20260523b">
  <style>
    /* ===== 赛事详情页专用样式 ===== */
    :root {
      --bg: #1A1A2E;
      --bg-card: rgba(255,255,255,.03);
      --border: rgba(255,255,255,.06);
      --gold: #c9a84c;
      --gold-light: #fbbf24;
      --text: #e0e0f0;
      --text-muted: #7a7a90;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* 顶栏 */
    .d-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      background: rgba(26,26,46,.95);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .d-header__left { display: flex; align-items: center; gap: 12px; }
    .d-header__logo { font-size: 1.2rem; font-weight: 700; color: var(--gold); text-decoration: none; }
    .d-header__back {
      color: var(--text-muted); text-decoration: none;
      font-size: .85rem; padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 8px; transition: all .2s;
    }
    .d-header__back:hover { border-color: var(--gold); color: var(--gold); }

    /* 主内容 */
    .d-main { max-width: 960px; margin: 0 auto; padding: 24px; }
    .d-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .d-subtitle { font-size: .85rem; color: var(--text-muted); margin-bottom: 24px; }

    /* 封面 */
    .d-cover { margin-bottom: 24px; border-radius: 12px; overflow: hidden; }
    .d-cover img { width: 100%; max-height: 320px; object-fit: cover; display: block; }

    /* 元信息网格 */
    .d-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .d-meta-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .d-meta__label { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .d-meta__value { font-size: 1rem; font-weight: 600; }

    /* 状态标签（复用 c-status-badge）*/
    .c-status-badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 6px; font-size: .82rem; font-weight: 600; letter-spacing: .03em;
    }
    .c-status--live      { background: rgba(239,68,68,.15); color: var(--danger); }
    .c-status--registering { background: rgba(16,185,129,.15); color: var(--success); }
    .c-status--ready     { background: rgba(59,130,246,.15); color: #60a5fa; }
    .c-status--finished   { background: rgba(255,255,255,.06); color: var(--text-muted); }
    .c-status--created    { background: rgba(201,168,76,.1);  color: var(--gold); }
    .c-status--archived   { background: rgba(255,255,255,.03); color: #555; }

    /* 区块 */
    .d-section { margin-bottom: 24px; }
    .d-section h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--gold); }
    .d-desc { font-size: .9rem; color: var(--text-muted); line-height: 1.7; white-space: pre-wrap; }

    /* 对阵 */
    .d-teams {
      display: flex; align-items: center; justify-content: center;
      gap: 24px; padding: 16px 0;
    }
    .d-team { text-align: center; }
    .d-team__label { font-size: .72rem; color: var(--text-muted); margin-bottom: 4px; }
    .d-team--red .d-team__name { color: #ef4444; }
    .d-team--blue .d-team__name { color: #60a5fa; }
    .d-team__name { font-size: 1.1rem; font-weight: 700; }
    .d-vs { font-size: 1.2rem; font-weight: 800; color: var(--gold); }

    /* 参赛者列表 */
    .d-participant-list { display: flex; flex-direction: column; gap: 6px; }
    .d-participant-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .88rem;
    }
    .d-participant__name { flex: 1; }
    .d-participant__side { font-size: .72rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .d-participant__side--red  { background: rgba(239,68,68,.12); color: #ef4444; }
    .d-participant__side--blue { background: rgba(96,165,250,.12); color: #60a5fa; }

    /* 加载/错误/空状态（复用 competition 样式）*/
    .c-loading, .c-error, .c-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .c-loading__spinner {
      width: 32px; height: 32px; margin: 0 auto 12px;
      border: 3px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: cSpin .8s linear infinite;
    }
    @keyframes cSpin { to { transform: rotate(360deg); } }
    .c-error__text { color: var(--danger); margin-bottom: 16px; }
    .c-btn {
      display: inline-block; padding: 10px 24px;
      border-radius: 10px; border: none;
      font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .c-btn--primary { background: linear-gradient(135deg, #c9a84c, #a88b3c); color: #1A1A2E; }
    .c-btn--primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,168,76,.25); }
  </style>
</head>
<body>

  <!-- 顶栏 -->
  <header class="d-header">
    <div class="d-header__left">
      <a href="./competition.html" class="d-header__logo">🏆 赛事详情</a>
    </div>
    <a href="./competition.html" class="d-header__back">← 返回赛事列表</a>
  </header>

  <!-- 主内容 -->
  <main class="d-main">
    <h1 class="d-title" id="dTitle">赛事详情</h1>
    <p class="d-subtitle" id="dSubtitle">加载中…</p>

    <!-- 详情容器 -->
    <div id="dDetail">
      <div class="c-loading">
        <div class="c-loading__spinner"></div>
        <div>正在加载赛事详情…</div>
      </div>
    </div>
  </main>

  <!-- ===== 模块脚本（严格按顺序加载）===== -->
  <script src="modules/competitionDetail/detailStore.js?v=20260526b"></script>
  <script src="modules/competitionDetail/detailApi.js?v=20260526b"></script>
  <script src="modules/competitionDetail/detailView.js?v=20260526b"></script>
  <!-- Bridge 必须在 detailPage 之前加载，确保 window.CompetitionLegacyBridge 就绪 -->
  <!-- 俱乐部报名逻辑（从 app.js 提取，不含 socket.io / DOM 初始化） -->
  <script src="modules/competitionDetail/clubRegShim.js?v=20260523p"></script>
  <script src="modules/competition/competitionLegacyBridge.js?v=20260526a"></script>
  <script src="modules/competitionDetail/detailPage.js?v=20260526b"></script>

</body>
</html>
