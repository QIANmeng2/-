<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛事中心 · 梦工厂</title>
  <link rel="stylesheet" href="styles.css?v=20260523a">
  <style>
    /* ===== 赛事独立页专用样式（零外部依赖） ===== */
    :root {
      --bg: #1A1A2E;
      --bg-card: rgba(255,255,255,.03);
      --border: rgba(255,255,255,.06);
      --gold: #c9a84c;
      --gold-light: #fbbf24;
      --text: #e0e0e0;
      --text-muted: #7a7a90;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    /* 顶栏 */
    .c-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(26,26,46,.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .c-header__left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .c-header__logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold);
      text-decoration: none;
    }
    .c-header__back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .85rem;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all .2s;
    }
    .c-header__back:hover { border-color: var(--gold); color: var(--gold); }
    /* 主内容 */
    .c-main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }
    .c-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .c-subtitle {
      font-size: .85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    /* 状态标签 */
    .c-status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .03em;
    }
    .c-status--live { background: rgba(239,68,68,.15); color: var(--danger); }
    .c-status--registering { background: rgba(16,185,129,.15); color: var(--success); }
    .c-status--ready { background: rgba(59,130,246,.15); color: #60a5fa; }
    .c-status--finished { background: rgba(255,255,255,.06); color: var(--text-muted); }
    .c-status--created { background: rgba(201,168,76,.1); color: var(--gold); }
    .c-status--archived { background: rgba(255,255,255,.03); color: #555; }
    /* 赛事卡片 */
    .c-list { display: flex; flex-direction: column; gap: 10px; }
    .c-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      color: inherit;
    }
    .c-card:hover {
      background: rgba(255,255,255,.05);
      border-color: rgba(201,168,76,.2);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .c-card__icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.3rem;
    }
    .c-card__icon--training { background: rgba(59,130,246,.12); color: #60a5fa; }
    .c-card__icon--regular { background: rgba(201,168,76,.12); color: var(--gold); }
    .c-card__icon--arena { background: rgba(16,185,129,.12); color: var(--success); }
    .c-card__body { flex: 1; min-width: 0; }
    .c-card__title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .c-card__meta {
      display: flex;
      gap: 12px;
      font-size: .78rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .c-card__right { text-align: right; flex-shrink: 0; }
    /* 空状态 */
    .c-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .c-empty__icon { font-size: 3rem; margin-bottom: 12px; opacity: .3; }
    .c-empty__text { font-size: .9rem; }
    /* 错误状态 */
    .c-error {
      text-align: center;
      padding: 60px 20px;
    }
    .c-error__text { color: var(--danger); margin-bottom: 16px; }
    .c-btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .c-btn--primary {
      background: linear-gradient(135deg, #c9a84c, #a88b3c);
      color: #1A1A2E;
    }
    .c-btn--primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,168,76,.25); }
    /* 加载状态 */
    .c-loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .c-loading__spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: cSpin .8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes cSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 顶栏（最小化） -->
  <header class="c-header">
    <div class="c-header__left">
      <span class="c-header__logo">🏆 赛事中心</span>
    </div>
    <a href="./" class="c-header__back">← 返回主页</a>
  </header>

  <!-- 主内容 -->
  <main class="c-main">
    <h1 class="c-title">全部赛事</h1>
    <p class="c-subtitle" id="cSubtitle">加载中…</p>

    <!-- 赛事列表容器 -->
    <div id="cList" class="c-list">
      <div class="c-loading">
        <div class="c-loading__spinner"></div>
        <div>正在加载赛事列表…</div>
      </div>
    </div>
  </main>

  <!-- ===== 零外部依赖脚本 ===== -->
  <script>
  /**
   * competition.html — 赛事中心独立隔离版
   * 
   * 设计原则：
   * 1. 不依赖 app.js / window.xxx / globalState
   * 2. 不依赖聊天 / websocket / tab / 通知 / auth modal / onboarding
   * 3. 独立 fetch → 独立 state → 独立渲染
   * 4. 打开页面 → 请求 /api/matches → 渲染列表
   */

  ;(function() {
    'use strict';

    // ===== 独立 State =====
    var API_BASE = 'https://perpetual-enchantment-production-b163.up.railway.app';
    var state = {
      matches: [],
      loading: true,
      error: null
    };

    // ===== 独立 fetch（无缓存、无重试、无 tok 自动 logout） =====
    function fetchAPI(path) {
      var url = API_BASE + path;
      return fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        signal: AbortSignal.timeout(15000)
      }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function(data) {
        // 解包统一响应
        if (data && data.success === true && data.data !== undefined) return data.data;
        return data;
      });
    }

    // ===== 模式标签 =====
    var MODE_LABELS = { training: '训练赛', regular: '正赛', arena: '自由赛' };
    var MODE_ICONS  = { training: '⚔️', regular: '🏆', arena: '🎯' };

    // ===== 状态转中文 =====
    function statusLabel(s) {
      var map = {
        CREATED: '已创建', REGISTERING: '报名中', READY: '准备就绪',
        LIVE: '进行中', FINISHED: '已结束', ARCHIVED: '已归档'
      };
      return map[(s||'').toUpperCase()] || s;
    }
    function statusClass(s) {
      return 'c-status--' + (s||'').toLowerCase();
    }

    // ===== 格式化时间 =====
    function fmtTime(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      var m = d.getMonth() + 1;
      var day = d.getDate();
      var h = d.getHours();
      var min = d.getMinutes();
      return m + '/' + day + ' ' + String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
    }

    // ===== 渲染 =====
    function render() {
      var container = document.getElementById('cList');
      var subtitle  = document.getElementById('cSubtitle');

      // 加载中
      if (state.loading) {
        subtitle.textContent = '加载中…';
        container.innerHTML = '<div class="c-loading"><div class="c-loading__spinner"></div><div>正在加载赛事列表…</div></div>';
        return;
      }

      // 错误
      if (state.error) {
        subtitle.textContent = '加载失败';
        container.innerHTML = '<div class="c-error"><p class="c-error__text">' + escapeHtml(state.error) + '</p><button class="c-btn c-btn--primary" onclick="location.reload()">重新加载</button></div>';
        return;
      }

      // 空列表
      var matches = state.matches;
      if (!matches || matches.length === 0) {
        subtitle.textContent = '暂无赛事';
        container.innerHTML = '<div class="c-empty"><div class="c-empty__icon">📭</div><div class="c-empty__text">当前没有进行中的赛事</div></div>';
        return;
      }

      // 渲染列表
      subtitle.textContent = '共 ' + matches.length + ' 场赛事';
      var html = '';
      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        var modeIcon = MODE_ICONS[m.mode] || '⚔️';
        var modeClass = 'c-card__icon--' + (m.mode || 'training');
        var st = (m.status || '').toUpperCase();
        html += '<a class="c-card" href="./" title="返回主页查看详情">' +
          '<div class="c-card__icon ' + modeClass + '">' + modeIcon + '</div>' +
          '<div class="c-card__body">' +
            '<div class="c-card__title">' + escapeHtml(m.title || '未命名赛事') + '</div>' +
            '<div class="c-card__meta">' +
              '<span>' + (MODE_LABELS[m.mode] || m.mode) + '</span>' +
              '<span>BO' + (m.bo || 1) + '</span>' +
              (m.start_time ? '<span>' + fmtTime(m.start_time) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="c-card__right">' +
            '<span class="c-status-badge ' + statusClass(st) + '">' + statusLabel(st) + '</span>' +
          '</div>' +
        '</a>';
      }
      container.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ===== 初始化 =====
    function init() {
      fetchAPI('/api/matches').then(function(data) {
        state.matches = data.matches || data || [];
        state.loading = false;
        state.error = null;
        render();
      }).catch(function(err) {
        // 降级：试试 /api/competitions
        fetchAPI('/api/competitions').then(function(data) {
          var comps = data.competitions || [];
          state.matches = comps.map(function(c) {
            return {
              id: c.id,
              title: c.name || c.title,
              mode: c.mode || 'training',
              status: c.comp_status || c.status,
              bo: c.bo || 1,
              start_time: c.start_time
            };
          });
          state.loading = false;
          state.error = null;
          render();
        }).catch(function(err2) {
          state.loading = false;
          state.error = '无法连接赛事服务：' + (err.message || '网络错误');
          render();
        });
      });
    }

    // 启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // 暴露 state 供调试
    window.__COMP_STATE = state;
  })();
  </script>
</body>
</html>
