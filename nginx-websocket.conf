# ============================================
# Socket.IO / WebSocket 代理优化配置
# 放入 /etc/nginx/conf.d/websocket-upstream.conf
# 在主配置中用 include 引入
# ============================================

# ------- Upstream: Node.js 后端集群（可扩展）-------
upstream backend {
    # 单节点
    server 127.0.0.1:3000;
    # 多节点示例：
    # server 127.0.0.1:3000;
    # server 127.0.0.1:3001;
    # server 127.0.0.1:3002;
    keepalive 32;   # 保持 32 条空闲连接（连接复用）
}

# ------- Socket.IO 专用 location -------
location /socket.io/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;

    # --- WebSocket 升级必须 ---
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # --- 透传真实 IP ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- WebSocket 超时（防止半开连接）---
    proxy_read_timeout  86400s;   # 24h，适配长连接
    proxy_send_timeout  86400s;

    # --- 关闭缓冲（实时通信）---
    proxy_buffering    off;
    proxy_buffer_size  4k;

    # --- 重试 / 容错 ---
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_next_upstream_timeout 2s;
    proxy_next_upstream_tries   2;
}

# ------- 通用 /api WebSocket 升级（兼容非 socket.io 路径）-------
location /api/socket {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_buffering off;
}
