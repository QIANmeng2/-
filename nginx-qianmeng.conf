# ============================================
# neondream.cn - Nginx 性能优化配置
# 适用：Tencent Cloud CVM + Nginx
# ============================================

# ------- 核心性能参数 (nginx.conf http 块) -------
worker_processes auto;          # 自动匹配 CPU 核心数
worker_cpu_affinity auto;      # CPU 亲和性绑定
worker_rlimit_nofile 65535;   # 提高文件描述符限制

events {
    worker_connections 65535;   # 单 worker 最大连接数
    use epoll;                   # Linux 高性能事件模型
    multi_accept on;            # 一次接受所有新连接
}

http {
    # ------- 基础优化 -------
    sendfile on;                 # 零拷贝传输
    tcp_nopush on;              # 累计包满再发（配合 sendfile）
    tcp_nodelay on;             # 禁用 Nagle，降低延迟
    types_hash_max_size 2048;
    server_tokens off;           # 隐藏 Nginx 版本号

    # ------- 连接复用 / Keep-Alive -------
    keepalive_timeout  75s;      # 保持连接 75 秒
    keepalive_requests 1000;     # 单连接最大请求数

    # ------- Gzip 压缩开启 -------
    gzip on;
    gzip_vary on;                # 响应头添加 Vary: Accept-Encoding
    gzip_proxied any;            # 代理请求也压缩
    gzip_comp_level 5;           # 压缩级别 1-9，5 = 性价比最高
    gzip_min_length 1024;        # 小于 1KB 不压缩
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------- 浏览器缓存头 (静态资源) -------
    map $sent_http_content_type $cache_control {
        default                                         "";
        "~text/css"                                     "max-age=31536000, immutable";
        "~application/javascript"                         "max-age=31536000, immutable";
        "~image/"                                        "max-age=31536000, immutable";
        "~font/"                                         "max-age=31536000, immutable";
        "~application/font"                              "max-age=31536000, immutable";
    }

    # ------- 上游超时控制 -------
    proxy_connect_timeout 10s;
    proxy_send_timeout   60s;
    proxy_read_timeout   60s;
    proxy_buffering      on;
    proxy_buffer_size    16k;
    proxy_buffers        32 16k;

    # ------- 客户端上传限制 -------
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # ======= 站点配置：neondream.cn =======
    # 注意：neondream.cn 走 Cloudflare CDN，SSL 由 Cloudflare 终端处理
    # 服务器只用 HTTP (80)，Cloudflare 负责对外提供 HTTPS
    server {
        listen 80;
        server_name neondream.cn www.neondream.cn;

        # --- 根目录：静态文件 ---
        root /var/www/html;
        index index.html;

        # --- 静态资源：长缓存 + 立即生效 ---
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control $cache_control always;
            add_header Access-Control-Allow-Origin *;
            access_log off;
        }

        # --- favicon.ico ---
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # --- HTML 文件：不缓存 / 短时缓存 ---
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # --- Socket.IO / WebSocket 代理（已启用）---
        include /etc/nginx/conf.d/websocket-upstream.conf;

        # --- Node.js 后端反向代理 ---
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- SPA 兜底：所有非文件请求转发到 index.html ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
